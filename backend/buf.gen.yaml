version: v2

# go_package is explicit in the .proto files, so managed mode is off and the
# generated import path stays readable.
managed:
  enabled: false

plugins:
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative

  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
      # A missing method fails at compile time instead of runtime.
      - require_unimplemented_servers=true
