syntax = "proto3";

package catalog.v1;

option go_package = "github.com/qvarkk/mog-traqqer/backend/gen/catalog/v1;catalogv1";

import "google/protobuf/timestamp.proto";

service CatalogService {
  rpc ListMuscleGroups(ListMuscleGroupsRequest) returns (ListMuscleGroupsResponse);
  rpc CreateMuscleGroup(CreateMuscleGroupRequest) returns (CreateMuscleGroupResponse);
  rpc UpdateMuscleGroup(UpdateMuscleGroupRequest) returns (UpdateMuscleGroupResponse);
  rpc DeleteMuscleGroup(DeleteMuscleGroupRequest) returns (DeleteMuscleGroupResponse);
}

message MuscleGroup {
  string id = 1;
  string name = 2;
  bool is_system = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ListMuscleGroupsRequest {}

message ListMuscleGroupsResponse {
  repeated MuscleGroup muscle_groups = 1;
}

message CreateMuscleGroupRequest {
  string name = 1;
}

message CreateMuscleGroupResponse {
  MuscleGroup muscle_group = 1;
}

message UpdateMuscleGroupRequest {
  string id = 1;
  string name = 2;
}

message UpdateMuscleGroupResponse {
  MuscleGroup muscle_group = 1;
}

message DeleteMuscleGroupRequest {
  string id = 1;
}

message DeleteMuscleGroupResponse {}
